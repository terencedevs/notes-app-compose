# Project-wide Gradle settings.
# IDE (or command line) options passed to the Java VM.
# Increasing the max heap size to prevent OutOfMemoryError during dexing and KSP/Kotlin compilation.
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1g

# Enable parallel execution and caching to improve build performance
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX configuration
android.useAndroidX=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
